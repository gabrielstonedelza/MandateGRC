# Fly.io configuration for MandateGRC. Create the app and volume first (see DEPLOY.md):
#   fly launch --no-deploy --copy-config --name mandategrc
#   fly volumes create mandategrc_data --size 1 --region <your region>
app = "mandategrc"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  MANDATEGRC_ORIGIN = "https://mandategrc.app"
  TRUST_PROXY = "1"
  HOST = "0.0.0.0"
  PORT = "8080"
  MANDATEGRC_DATA_DIR = "/data"

[mounts]
  source = "mandategrc_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite + in-memory sign-in challenges: run exactly one machine and keep it running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
